[package]
name = "workflow-teploty"
version = "0.1.0"
edition = "2024"
description = "CPU and battery temperature curves, lid-aware performance control and cooling sleep for Windows"
repository = "https://github.com/Jirkas-prog/workflow-teploty"
build = "build.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
wmi = "0.18.4"
tray-icon = { version = "0.26.1", default-features = false }
raw-window-handle = "0.6"
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
windows = { version = "0.62.2", features = ["Win32_System_TaskScheduler", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 2
strip = true

[profile.dev]
debug = 1
