[package]
name = "workflow-teploty"
version = "0.2.0"
default-run = "workflow-teploty"
edition = "2024"
description = "CPU and battery temperature curves, lid-aware performance control and cooling sleep for Windows"
repository = "https://github.com/Jirkas-prog/workflow-teploty"
build = "build.rs"

[features]
release-tools = []

[[bin]]
name = "cooltakt-release"
path = "src/bin/release.rs"
required-features = ["release-tools"]

[dependencies]
anyhow = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.10"
hex = "0.4"
semver = "1"
ed25519-dalek = "2.2"
getrandom = "0.3"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
wmi = "0.18.4"
tray-icon = { version = "0.26.1", default-features = false }
raw-window-handle = "0.6"
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
windows = { version = "0.62.2", features = ["Win32_System_TaskScheduler", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 2
strip = true

[profile.dev]
debug = 1
